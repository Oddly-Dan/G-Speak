<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>G-Speak</title>
<meta name="description" content="A simple, minimal text-to-speech communication app." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%97%A3%EF%B8%8F</text></svg>">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-emoji" aria-hidden="true">🗣️</span>
      <h1>G-Speak</h1>
    </div>
    <button id="settings-btn" class="icon-btn" type="button" aria-label="Voice settings" aria-haspopup="true">⚙️</button>
  </header>

  <main>

    <!-- ===================== SENTENCE BAR ===================== -->
    <section class="sentence-area">
      <div class="sentence-row">
        <input id="sentence-bar" class="sentence-bar" type="text" inputmode="text" autocomplete="off"
               autocorrect="off" spellcheck="false" placeholder="Tap here to type…"
               aria-label="Sentence to speak" />
        <button id="clear-btn" class="icon-btn clear-btn" type="button" aria-label="Clear sentence">🗑️</button>
      </div>
      <button id="speak-btn" class="speak-btn" type="button">🔊 Speak!</button>
    </section>

    <!-- ===================== SUGGESTIONS ===================== -->
    <section class="suggestions" aria-label="Suggested words and phrases">
      <div class="chip-row" id="suggestions-row"></div>
    </section>

    <!-- ===================== MOOD TOGGLES ===================== -->
    <section class="moods" aria-label="Mood indicators">
      <div class="mood-row" id="mood-row"></div>
    </section>

    <!-- ===================== FAST NAV ===================== -->
    <nav class="fastnav" aria-label="Categories" id="fastnav"></nav>

  </main>

  <!-- ===================== SETTINGS POPOUT ===================== -->
  <div class="backdrop" id="settings-backdrop" hidden>
    <div class="popout settings-popout" id="settings-popout" role="dialog" aria-label="Voice settings">
      <div class="popout-header">
        <h2>⚙️ Voice Settings</h2>
        <button class="icon-btn" type="button" data-close="settings" aria-label="Close settings">✕</button>
      </div>
      <div class="popout-body">
        <label class="field">
          <span>Voice</span>
          <select id="voice-select"></select>
        </label>
        <label class="field">
          <span>Speed <output id="rate-output">1.0×</output></span>
          <input type="range" id="rate-range" min="0.5" max="2" step="0.05" value="1" />
        </label>
        <label class="field">
          <span>Pitch <output id="pitch-output">1.0</output></span>
          <input type="range" id="pitch-range" min="0" max="2" step="0.05" value="1" />
        </label>
        <label class="field">
          <span>Volume <output id="volume-output">100%</output></span>
          <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1" />
        </label>
        <button id="test-voice-btn" class="btn btn-secondary" type="button">🔊 Test voice</button>
      </div>
    </div>
  </div>

  <!-- ===================== NAV CATEGORY POPOVER ===================== -->
  <div class="backdrop" id="nav-backdrop" hidden>
    <div class="popout nav-popout" id="nav-popout" role="dialog" aria-label="Category items">
      <div class="popout-header">
        <h2 id="nav-popout-title"></h2>
        <button class="icon-btn" type="button" data-close="nav" aria-label="Close">✕</button>
      </div>
      <div class="popout-body">
        <div class="item-grid" id="nav-popout-grid"></div>
      </div>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
